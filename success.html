<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order confirmed — The Velvet Plate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23B87333' stroke-width='3'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23C45C26'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) tailwind.config = { theme: { extend: {
      colors: { char: '#1A1210', bark: '#3D1F14', ember: '#C45C26', honey: '#E8A04A', cream: '#F6EDE4', wine: '#6B2D3C', copper: '#B87333' },
      fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'] },
    } } };
  </script>
  <style>
    body { background:
      radial-gradient(50% 40% at 80% 0%, rgba(196,92,38,.25), transparent 70%),
      radial-gradient(40% 40% at 0% 100%, rgba(107,45,60,.35), transparent 70%), #1A1210; color: #F6EDE4; min-height: 100vh; }
  </style>
</head>
<body class="font-sans antialiased">
  <main class="max-w-xl mx-auto px-4 py-16">
    <a href="index.html" class="flex items-center gap-3 mb-12">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="15" fill="none" stroke="#B87333" stroke-width="3"/>
        <circle cx="29" cy="11" r="3.5" fill="#C45C26"/>
      </svg>
      <span class="leading-none">
        <span class="block font-display font-semibold text-lg">The Velvet Plate</span>
        <span class="block text-[10px] uppercase tracking-[.3em] text-copper mt-1">Huntsville</span>
      </span>
    </a>
    <div id="out" class="text-cream">Loading your order…</div>
    <a href="index.html" class="inline-block mt-10 rounded-full border border-cream/30 hover:border-honey hover:text-honey px-6 py-3 text-sm">← Back to the truck</a>
  </main>

  <script src="config.js"></script>
  <script>
    'use strict';
    const DEMO = (window.VELVET_CONFIG || {}).mode === 'demo';
    const out = document.getElementById('out');
    const money = (c) => '$' + (c / 100).toFixed(2);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const prettyDate = (iso) => {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    };

    function orderCard(o, heading = true) {
      const paid = String(o.status).startsWith('paid');
      return `
        ${heading ? `<p class="text-copper uppercase tracking-[.3em] text-xs mb-3">${paid ? 'Order confirmed' : 'Order received'}</p>
        <h1 class="font-display text-4xl md:text-5xl font-semibold">${paid ? 'See you at the truck' : 'Payment processing'}, ${esc(o.customerName.split(' ')[0])}.</h1>
        ${paid ? '' : '<p class="mt-3 text-cream/60">Stripe is confirming your payment. Refresh in a moment.</p>'}` : ''}
        <section class="mt-8 rounded-3xl bg-char/70 border border-copper/25 p-6">
          <div class="flex justify-between gap-4 text-sm">
            <div>
              <p class="text-cream/50">Pickup</p>
              <p class="font-display text-xl">${esc(o.stopName)}</p>
              <p class="text-cream/70">${prettyDate(o.pickupDate)} · ${esc(o.pickupWindow)}</p>
            </div>
            <div class="text-right">
              <p class="text-cream/50">Order</p>
              <p class="font-mono text-xs mt-1">${esc(String(o.orderId).slice(0, 8).toUpperCase())}</p>
              <span class="inline-block mt-2 rounded-full px-2.5 py-0.5 text-[11px] uppercase tracking-widest ${paid ? 'bg-ember/20 text-honey border border-ember/40' : 'bg-wine/50 border border-wine'}">${esc(o.status)}</span>
            </div>
          </div>
          <ul class="mt-6 divide-y divide-copper/15 text-sm">
            ${o.items.map((l) => `<li class="py-2 flex justify-between"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.qty * l.unitPriceCents)}</span></li>`).join('')}
          </ul>
          <div class="mt-4 pt-4 border-t border-copper/25 flex justify-between items-baseline">
            <span class="text-cream/60">Total</span><span class="font-display text-2xl text-honey">${money(o.totalCents)}</span>
          </div>
          ${o.notes ? `<p class="mt-4 text-sm text-cream/60">Notes: ${esc(o.notes)}</p>` : ''}
        </section>`;
    }

    function readDemoOrders() {
      try { return JSON.parse(localStorage.getItem('velvet-plate-demo-orders')) || []; } catch { return []; }
    }

    async function load() {
      const params = new URLSearchParams(location.search);

      if (DEMO) {
        const orders = readDemoOrders();
        const id = params.get('demo_order');
        const o = id && orders.find((x) => x.orderId === id);
        if (o) {
          out.innerHTML = orderCard(o) + `<p class="mt-4 text-xs text-cream/40">Demo order — simulated, saved only in this browser. No payment was taken.</p>`;
          return;
        }
        out.innerHTML = orders.length
          ? `<p class="text-copper uppercase tracking-[.3em] text-xs mb-3">Demo</p><h1 class="font-display text-4xl font-semibold">Demo orders</h1>
             <p class="mt-2 text-sm text-cream/50">${orders.length} simulated order(s) in this browser.</p>` +
            orders.map((x) => orderCard(x, false)).join('')
          : `<h1 class="font-display text-4xl font-semibold">No demo orders yet.</h1><p class="mt-3">Place one from the pre-order panel.</p>`;
        return;
      }

      const sid = params.get('session_id');
      if (!sid) { out.innerHTML = '<h1 class="font-display text-4xl font-semibold">No order to show.</h1>'; return; }
      try {
        const res = await fetch('/api/orders/by-session?session_id=' + encodeURIComponent(sid));
        if (!res.ok) throw new Error(res.status);
        const o = await res.json();
        out.innerHTML = orderCard(o);
        try { localStorage.removeItem('velvet-plate-cart'); } catch {}
        // The webhook may land a moment after redirect — poll briefly.
        if (o.status === 'pending' && (load.tries = (load.tries || 0) + 1) < 6) setTimeout(load, 2000);
      } catch {
        out.innerHTML = '<h1 class="font-display text-4xl font-semibold">We could not find that order.</h1><p class="mt-3">If you were charged, call the truck at (256) 555-0142.</p>';
      }
    }
    load();
  </script>
</body>
</html>
